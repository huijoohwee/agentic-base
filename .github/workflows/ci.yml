name: Integration Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enforce shared owner reuse
        uses: huijoohwee/agentic-os/.github/actions/owner-reuse@1d8e340eba37d1ae66d26328dc309f236b69e181
        with:
          baseline: 0157d4c1f34be78096a1588778f23903538dfbe3
      - name: Install the exact development toolchain
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for rendered target audit
        run: npx playwright install --with-deps chromium
      - name: Verify source and contract
        run: npm run check
      - name: Check out the Graph adapter suite
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huijoohwee/agentic-graph
          ref: ddf490bd58d87d766a7a174c3aaf30e8c55433c4
          path: graph-consumer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /canvas/package.json
            /canvas/tsconfig.json
            /canvas/src/__tests__/dataViewBrowserAdapter.test.tsx
            /canvas/src/features/markdown/ui/dataViewBrowserAdapter.tsx
            /canvas/src/features/sequence/
            /canvas/src/tests/lib/
      - name: Run the Graph adapter suite against the Base candidate
        if: github.event_name == 'pull_request'
        run: |
          archive=$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")
          package_name=$(node -p "require('./package.json').name")
          package_dir="graph-consumer/node_modules/$package_name"
          mkdir -p "$package_dir"
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$package_dir"
          cd graph-consumer
          TSX_TSCONFIG_PATH=canvas/tsconfig.json node --import tsx --test canvas/src/__tests__/dataViewBrowserAdapter.test.tsx
